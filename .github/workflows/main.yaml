name: GitHub RDP Tailscale Edition (with Docker)

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Set RDP Password'
        required: true
        default: 'Atay@Bna3na3#2026'

jobs:
  build:
    runs-on: ubuntu-latest # تحويل إلى Ubuntu لدعم Docker و RDP معاً بكفاءة
    steps:
      - name: Initializing Environment
        run: echo "Starting Linux Desktop deployment with Docker..."

      # 1. تثبيت الـ Desktop Environment (XFCE خفيف وسريع) وسيرفر RDP (Xrdp)
      - name: Installing Desktop & RDP
        run: |
          sudo apt-get update
          sudo apt-get install -y xfce4 xfce4-goodies xrdp
          # ضبط الـ RDP عشان يستخدم واجهة XFCE
          echo "xfce4-session" > ~/.xsession
          sudo systemctl enable xrdp
          sudo systemctl start xrdp
          # فتح بورت الـ RDP في جدار الحماية المحلي
          sudo ufw allow 3389/tcp

      # 2. تثبيت وتجهيز Docker الأصيل
      - name: Installing Docker
        run: |
          sudo apt-get install -y docker.io
          sudo systemctl start docker
          sudo systemctl enable docker
          # إضافة المستخدم الحالي لجروب Docker عشان تشغله بدون sudo مستقبلاً
          sudo usermod -aG docker $USER
          echo "🐳 Docker installed successfully!"

      # 3. تثبيت وتوصيل Tailscale
      - name: Connecting to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_KEY }}
          args: --hostname=cloud-linux-rdp --accept-routes

      # 4. إعداد حساب المستخدم والـ Password للـ RDP
      - name: Configuring Remote Desktop Credentials
        run: |
          # تغيير باسوورد المستخدم الحالي (runner)
          echo "runner:${{ github.event.inputs.password }}" | sudo chpasswd
          echo "Credentials configured successfully."

      # 5. الحفاظ على الاتصال وطباعة الـ IP
      - name: Maintaining Connection
        run: |
          echo "=========================================="
          echo "Server is LIVE via Tailscale!"
          echo "Username: runner"
          echo "Password: ${{ github.event.inputs.password }}"
          echo "Your Tailscale IP Address:"
          tailscale ip -4
          echo "=========================================="
          
          # حلقة Keep-Alive لمنع السيرفر من الإغلاق (لمدة 6 ساعات)
          while true; do
            echo "Keep-alive: $(date)"
            sleep 300
          done
